name: ✨ Feature request
description: Propose a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      description: What do you need to do that is not possible today (or is very hard) with GopherML?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: The API you would like to use (Go pseudocode welcome).
      placeholder: |
        ```go
        model := linear_model.NewGradientBoosting()
        model.Fit(X, y)
        ```
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Project area
      options:
        - linear_model
        - tree
        - ensemble
        - crypto
        - metrics
        - model_selection
        - preprocessing
        - persistence
        - utils
        - go-nlp (standalone module)
        - documentation
        - other
    validations:
      required: true
  - type: checkboxes
    id: perf
    attributes:
      label: Design commitment
      options:
        - label: I understand the core keeps **zero dependencies** and prioritizes performance (see CONTRIBUTING.md)
          required: true
