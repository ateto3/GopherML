name: 🐛 Bug report
description: Report incorrect behavior in GopherML
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting the issue. Reminder: for **security vulnerabilities** follow [SECURITY.md](https://github.com/ateto3/gopherml/security/advisories/new) and do not open a public issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What you expected to happen and what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest Go snippet that demonstrates the problem.
      placeholder: |
        1. Create a model with `ensemble.NewRandomForestClassifier()`
        2. Call `Fit(X, y)` with ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "commit SHA or date of the checkout"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, architecture and Go version.
      placeholder: "Ubuntu 24.04, amd64, go1.25.6"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `go test ./... -race` and the failure is reproducible
          required: true
        - label: I searched open/closed issues and this is not a duplicate
          required: true
